<!doctype html><html><meta charset="utf-8"><title>Integrated graphics verification</title><style>body{margin:0;background:#222;color:white;font:12px monospace}canvas{display:block}#tools{position:fixed;top:8px;left:8px;background:#15251ee8;padding:10px;max-width:540px}button{padding:8px;margin:4px}pre{max-height:48vh;overflow:auto}</style><canvas id="game"></canvas><section id="tools"><button id="run" disabled>LOADING ORIGINAL ASSETS…</button><button id="low">NEW LOW</button><button id="high">HIGH</button><pre id="status">Loading…</pre></section><script type="module">
import {RallyView} from './client/view.js';
import {generateCourse,direction,nearestPoint} from './shared/course.js';
import {makeWorld} from './shared/physics.js';
import {generateSpectators} from './shared/spectators.js';
const observe=data=>new URL(location.href).searchParams.has('record')?fetch('http://127.0.0.1:8799/',{method:'POST',body:JSON.stringify(data)}).catch(()=>{}):Promise.resolve();addEventListener('unhandledrejection',e=>observe({fatal:String(e.reason?.stack||e.reason)}));addEventListener('error',e=>observe({fatal:e.message}));observe({boot:true});const view=new RallyView(document.querySelector('canvas'));await view.load(message=>observe({loading:message}));observe({loaded:true});
const course=generateCourse(12345,'coop',0,1001);view.setQuality('low');view.buildCourse(course);view.setActive(true);
const state=makeWorld(course,'coop',1),person=generateSpectators(course)[0],index=nearestPoint(course,person.x,person.z).index,p=course.points[index],d=direction(course.points,index);
state.phase='running';Object.assign(state.cars[0],{x:p.x,y:p.y+.68,z:p.z,yaw:Math.atan2(d.x,d.z),nearest:index,progress:index});view.setSnapshot(state);
view.renderer.info.autoReset=false;let last=performance.now(),phase=null,started=0,samples=[],results=[],mode='new-low',report={},errors=[],modeFrames=0;
const oldError=console.error;console.error=(...args)=>{errors.push(args.map(String).join(' '));oldError(...args);observe({error:args.map(String).join(' ')});};
function configure(name){mode=name;view.setQuality(name==='high'?'high':'low');if(name==='old-low'){view.renderer.setPixelRatio(Math.min(devicePixelRatio,1));view.frame.setReduced(false);view.details?.setReduced(false);}view.frame.reset();samples=[];modeFrames=0;started=performance.now();}
document.querySelector('#low').onclick=()=>{phase=null;configure('new-low');};document.querySelector('#high').onclick=()=>{phase=null;configure('high');};
document.querySelector('#run').disabled=false;document.querySelector('#run').textContent='COMPARE OLD LOW / NEW LOW / HIGH';document.querySelector('#run').onclick=()=>{results=[];phase=0;configure('old-low');};
function draw(now){const dt=Math.min(.1,(now-last)/1000);last=now;state.elapsed+=dt;view.look.yaw=Math.sin(now/1600)*12;view.renderer.info.reset();view.update(dt,now,{});modeFrames++;const elapsed=now-started,smoke=new URL(location.href).searchParams.has('smoke');
 if(phase!==null&&(smoke||elapsed>3000))samples.push(dt*1000);
 const gl=view.renderer.getContext();report={mode,ready:true,originalMap:1,originalForestVisible:true,drawPixels:view.frame.target.width*view.frame.target.height,resolution:[view.frame.target.width,view.frame.target.height],samples:view.frame.target.samples,depthTexture:Boolean(view.frame.target.depthTexture),motionBlur:view.frame.material.uniforms.motionIntensity.value,grassInstances:view.details.meshes.reduce((s,m)=>s+m.geometry.instanceCount,0),grassDistance:view.details.distance,drawCalls:view.renderer.info.render.calls,triangles:view.renderer.info.render.triangles,visibleCrowd:view.spectators.stats?.visible,errors};
 if(phase!==null&&(smoke?modeFrames>=4:elapsed>8000)){const sorted=samples.toSorted((a,b)=>a-b);observe({modeReport:report,...(mode==='new-low'?{image:document.querySelector('canvas').toDataURL()}: {})});results.push({...report,frameCount:samples.length,medianFrameMs:sorted[Math.floor(sorted.length*.5)],p95FrameMs:sorted[Math.floor(sorted.length*.95)],glError:gl.getError()});phase++;if(phase<3)configure(['old-low','new-low','high'][phase]);else{phase=null;if(!smoke)configure('new-low');}}
 document.querySelector('#status').textContent=JSON.stringify({running:phase!==null,current:report,results},null,2);if(!(smoke&&results.length===3)){if(smoke)setTimeout(()=>draw(performance.now()),16);else requestAnimationFrame(draw);}
}configure('new-low');if(new URL(location.href).searchParams.has('smoke'))setTimeout(()=>draw(performance.now()),16);else requestAnimationFrame(draw);if(new URL(location.href).searchParams.has('autorun'))document.querySelector('#run').onclick();
</script></html>
