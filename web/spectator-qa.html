<!doctype html><html><meta charset="utf-8"><style>body{margin:0;background:#222;font:13px monospace}#tools{position:fixed;z-index:20;top:8px;left:8px;background:#222b;color:white;padding:8px}button{padding:8px}#metrics{white-space:pre}</style><canvas id="game"></canvas><div id="tools"><button id="road">ROADSIDE</button><button id="lineup">LINEUP</button><button id="hit">IMPACT</button><button id="reset">RESET</button><button id="map">NEXT MAP</button><button id="car">COCKPIT</button><button id="drive">DRIVE PAST</button><button id="crowds">TOGGLE CROWDS</button><button id="hide">HIDE TOOLS</button><div id="metrics">Loading original assets…</div></div><script type="module">
import * as T from 'three';import {RallyView} from './client/view.js';import {generateCourse,STAGES,DEFAULT_STAGE} from './shared/course.js';import{makeWorld}from'./shared/physics.js';import{generateSpectators,stepSpectators}from'./shared/spectators.js';
const view=new RallyView(document.querySelector('canvas'));await view.load();view.setQuality('auto');let stage=DEFAULT_STAGE,course,snapshot,first,mode='road',impactAt=-1,travel=0,showCrowds=true;const clock=new T.Clock();
function setup(){course=generateCourse(12345,'coop',STAGES[stage].blocks,STAGES[stage].seed);if(mode==='lineup')course={...course,nativeScene:null,spectators:[0,1,2,3].map((variant,id)=>({id,group:1,side:1,x:-3+id*2,y:20,z:50,yaw:0,variant,phase:id,scale:1}))};view.buildCourse(course);view.setActive(true);snapshot=makeWorld(course,'coop',1);snapshot.phase='running';view.setSnapshot(snapshot);first=(course.spectators||generateSpectators(course))[0];impactAt=-1;}
function camera(){const p=first;if(mode==='lineup'){view.camera.position.set(0,21.3,60);view.camera.lookAt(0,21.1,50);view.scene.background=new T.Color('#8fa8ad');for(const child of view.world.children)child.visible=child===view.spectators.root;const ground=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshStandardMaterial({color:'#5f7555',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.set(0,19.75,50);view.world.add(ground);}else{const nx=Math.sin(p.yaw),nz=Math.cos(p.yaw),floor=view.spectators.ground(p.x,p.z,p.y);view.camera.position.set(p.x+nx*8+nz*2,floor+1.5,p.z+nz*8-nx*2);view.camera.lookAt(p.x,floor+1,p.z);}view.camera.fov=55;view.camera.updateProjectionMatrix();view.frame.reset();}
setup();camera();document.querySelector('#road').onclick=()=>{mode='road';setup();camera();};document.querySelector('#lineup').onclick=()=>{mode='lineup';setup();camera();};document.querySelector('#map').onclick=()=>{stage=(stage+1)%STAGES.length;mode='road';setup();camera();};document.querySelector('#hit').onclick=()=>{const p=first;snapshot.spectatorHits=[];snapshot.cars[0]={...snapshot.cars[0],lastX:p.x-Math.sin(p.yaw)*3,lastZ:p.z-Math.cos(p.yaw)*3,x:p.x+Math.sin(p.yaw)*.1,z:p.z+Math.cos(p.yaw)*.1,y:p.y+.68,yaw:p.yaw,vx:Math.sin(p.yaw)*18,vz:Math.cos(p.yaw)*18,dead:false,finish:-1};stepSpectators(snapshot,.02,{...course,spectators:course.spectators||generateSpectators(course)});impactAt=performance.now();};document.querySelector('#reset').onclick=()=>{setup();camera();};document.querySelector('#car').onclick=()=>{mode='car';const p=first,c=snapshot.cars[0],nx=Math.sin(p.yaw),nz=Math.cos(p.yaw);c.x=p.x+nx*4+nz*9;c.z=p.z+nz*4-nx*9;c.y=p.y+.68;c.yaw=Math.atan2(-nz,nx);view.resetPresentation();view.look.yaw=0;};document.querySelector('#drive').onclick=()=>{mode='drive';travel=Math.max(0,first.group-30);view.setSeat(0);view.look.yaw=0;};document.querySelector('#crowds').onclick=()=>{showCrowds=!showCrowds;view.spectators.root.visible=showCrowds;};document.querySelector('#hide').onclick=()=>document.querySelector('#tools').hidden=true;
let frames=0,seconds=0,fps=0,boundsMetric=null;function draw(now){const dt=Math.min(.05,clock.getDelta());snapshot.elapsed+=dt;frames++;seconds+=dt;if(seconds>1){fps=frames/seconds;frames=0;seconds=0;const person=[...view.spectators.assigned.values()][0];if(person){person.root.updateMatrixWorld(true);person.mesh.skeleton.update();person.mesh.computeBoundingBox();const bounds=new T.Box3().setFromObject(person.root,true);boundsMetric={root:person.root.position.toArray(),minY:bounds.min.y,maxY:bounds.max.y,baseY:person.baseY};}}view.renderer.info.autoReset=false;view.renderer.info.reset();if(mode==='drive'){travel+=dt*12;if(travel>first.group+25)travel=first.group-30;let i=0;while(i<course.points.length-2&&course.distances[i+1]<travel)i++;const a=course.points[i],b=course.points[i+1],t=(travel-course.distances[i])/(course.distances[i+1]-course.distances[i]),c=snapshot.cars[0];Object.assign(c,{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t+.68,z:a.z+(b.z-a.z)*t,yaw:Math.atan2(b.x-a.x,b.z-a.z),speed:12,vx:12*Math.sin(c.yaw),vz:12*Math.cos(c.yaw),progress:i,nearest:i});for(const car of view.cars)car.presentation=null;view.update(dt,now,{throttle:.5});}else if(mode==='car')view.update(dt,now,{});else{view.spectators.update(snapshot,view.camera.position,now);view.shadows.update();view.frame.render(view.scene,view.camera,now);}document.querySelector('#metrics').textContent=JSON.stringify({map:STAGES[stage].name,fps:Math.round(fps),...view.spectators.stats,drawCalls:view.renderer.info.render.calls,triangles:view.renderer.info.render.triangles,crowds:showCrowds,boundsMetric,impactAge:impactAt<0?null:Math.round(now-impactAt)},null,2);requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
