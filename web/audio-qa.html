<!doctype html><html lang="en"><meta charset="utf-8"><title>Spectator audio verification</title>
<style>body{background:#18261e;color:#eef4ed;font:16px system-ui;padding:24px;max-width:900px}button{padding:12px;margin:8px}pre{white-space:pre-wrap}audio{display:block;margin:16px;width:90%}</style>
<h1>Spectator audio verification</h1><p>Real Web Audio rendering, two independent seat listeners. Quiet crowd, engine, and one shared crowd impact. No network messages added.</p>
<button id="run">RENDER AND VERIFY BOTH SEATS</button><pre id="status">Ready. Twelve seconds of driving are rendered offline, without playing through the speakers.</pre><div id="clips"></div>
<script type="module">
import{RallyAudio}from'./client/audio.js';import{SPECTATOR_SOUNDS}from'./client/spectator-audio.js';
const status=document.querySelector('#status'),assert=(v,message)=>{if(!v)throw Error(message);};
async function render(slot,gameVolume=.5,engine=true){
 const context=new OfflineAudioContext(2,12*44100,44100),audio=new RallyAudio();audio.context=context;audio.master=context.createGain();audio.master.connect(context.destination);
 for(const name of['gameBus','uiBus','musicBus']){audio[name]=context.createGain();audio[name].connect(audio.master);}audio.volumes.game=gameVolume;audio.applyVolumes();audio.ready=true;audio.unlocked=true;
 const manifest=await(await fetch('/assets/manifest.json')).json();audio.manifest=manifest;
 await Promise.all(Object.entries({...Object.fromEntries(Object.entries(manifest.sounds).filter(([name])=>engine&&!['menu_music','hover','click'].includes(name))),...SPECTATOR_SOUNDS}).map(async([name,entry])=>{const r=await fetch(entry.url);assert(r.ok,`Missing ${name}`);audio.buffers.set(name,await context.decodeAudioData(await r.arrayBuffer()));}));
 const people=Array.from({length:4},(_,id)=>({id,group:20,side:1,x:3,y:0,z:20+id*.4}));audio.setCourse({spectators:people});audio.active=true;
 const events=[],voice=audio.spectators.voice.bind(audio.spectators);let maxLoops=0,maxImpacts=0;
 audio.spectators.voice=(name,loop,offset)=>{const v=voice(name,loop,offset);if(v)events.push({name,loop,offset,at:context.currentTime});return v;};
 function update(t){const s={epoch:1,phase:'running',elapsed:t,cars:[{team:0,x:2.7,y:.68,z:-45+t*10,yaw:0,vx:0,vz:10,speed:10,doorAngle:0,mud:0,dead:false,finish:-1}],inputs:[{throttle:.25},{}],stats:{},spectatorHits:t>=6.35?people.map((p,i)=>({...p,time:6.32+i*.025,team:0,car:{vx:0,vz:10}})).filter(h=>h.time<=t):[]};audio.update(s,slot,{throttle:slot%2?0:.25});maxLoops=Math.max(maxLoops,audio.spectators.voices.size);maxImpacts=Math.max(maxImpacts,audio.spectators.shots.size);}
 update(0);for(let t=.05;t<12;t+=.05){const at=t;context.suspend(at).then(()=>{update(at);context.resume();});}
 const buffer=await context.startRendering();let peak=0,sum=0;for(let c=0;c<2;c++)for(const n of buffer.getChannelData(c)){assert(Number.isFinite(n),'non-finite sample');peak=Math.max(peak,Math.abs(n));sum+=n*n;}
 assert(peak<.98,'mix clips');assert(maxLoops<=2&&maxImpacts<=2,'unbounded voices');assert(events.filter(e=>!e.loop).length===1,'repeated snapshots replay impact');
 return{buffer,report:{slot,gameVolume,engine,peak,peakDb:20*Math.log10(peak||1e-12),rms:Math.sqrt(sum/(buffer.length*2)),maxLoops,maxImpacts,impactEvents:events.filter(e=>!e.loop),cheerVoices:events.filter(e=>e.loop).map(e=>e.name),missingSounds:audio.loadErrors}};
}
function wav(buffer){const n=buffer.length,bytes=new ArrayBuffer(44+n*4),v=new DataView(bytes),text=(at,s)=>[...s].forEach((c,i)=>v.setUint8(at+i,c.charCodeAt(0)));text(0,'RIFF');v.setUint32(4,36+n*4,true);text(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,44100,true);v.setUint32(28,176400,true);v.setUint16(32,4,true);v.setUint16(34,16,true);text(36,'data');v.setUint32(40,n*4,true);for(let i=0;i<n;i++)for(let c=0;c<2;c++)v.setInt16(44+i*4+c*2,Math.max(-32768,Math.min(32767,buffer.getChannelData(c)[i]*32767)),true);return URL.createObjectURL(new Blob([bytes],{type:'audio/wav'}));}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{const results=[];for(const slot of[0,1]){status.textContent=`Rendering ${slot?'navigator':'driver'}…`;results.push(await render(slot));}const muted=await render(0,0,false),crowdOnly=await render(0,.5,false);assert(muted.report.peak===0,'game volume does not mute crowd');assert(crowdOnly.report.peak>.001&&crowdOnly.report.peak<.14,'crowd mix too loud or silent');assert(JSON.stringify(results[0].report.impactEvents.map(e=>e.name))===JSON.stringify(results[1].report.impactEvents.map(e=>e.name)),'seat clips differ');assert(JSON.stringify(results[0].report.cheerVoices)===JSON.stringify(results[1].report.cheerVoices),'cheer clips differ');status.textContent=JSON.stringify({ok:true,seats:results.map(r=>r.report),mutedPeak:muted.report.peak,crowdOnlyPeak:crowdOnly.report.peak},null,2);for(const [i,result]of results.entries()){const label=document.createElement('p'),player=document.createElement('audio');label.textContent=i?'Navigator preview':'Driver preview';player.controls=true;player.src=wav(result.buffer);document.querySelector('#clips').append(label,player);}}catch(e){status.textContent=JSON.stringify({ok:false,error:e.stack});}finally{document.querySelector('#run').disabled=false;}};
</script></html>
