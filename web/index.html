<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24211f"><meta name="description" content="Right Right Right browser multiplayer"><title>Right Right Right</title></head><body>
<canvas id="game" aria-label="Right Right Right original game cockpit and forest"></canvas>
<div id="loading" class="native-box"><div>RIGHT RIGHT RIGHT</div><p id="load-status">Loading...</p></div>
<main id="menu" class="native-box hidden" aria-label="Right Right Right multiplayer menu">
<div id="native-title">RIGHT RIGHT RIGHT / 2 PLAYER CO-OP</div>
<div id="room-section"><label class="native-label intro">Host a room, choose a mode, and share its code with your friends.</label><button id="create-room">HOST GAME</button><form id="join-form"><input id="room-code" aria-label="Room code" maxlength="12" autocomplete="off" spellcheck="false"><button id="join-room" type="submit">JOIN CODE</button></form><label id="room-note" class="native-label">No accounts or extra apps needed. Everyone opens the same game version.</label><button id="copy-invite" class="hidden">COPY CODE</button></div>
<div id="advanced-section" class="hidden"><label class="native-label intro">LAN / VPN: enter the host's IPv4 address. Porthole: share UDP 7787, then join 127.0.0.1.</label><label class="native-label address-label">Host address</label><input id="host-address" value="127.0.0.1" aria-label="Host address" disabled><label class="native-label port-label">Port</label><input id="host-port" value="7787" aria-label="Port" disabled><button id="native-host" disabled>HOST</button><button id="native-join" disabled>JOIN</button><button id="open-porthole" disabled>OPEN PORTHOLE</button><button id="get-porthole" disabled>GET PORTHOLE</button></div>
<button id="disconnect">DISCONNECT</button><label id="native-status" class="native-label">0/2 players — Host a game, or enter your friend's room code.</label>
<button id="mode-coop" data-mode="coop">[ 2 PLAYER CO-OP ]</button><button id="mode-race" data-mode="race">4 PLAYER RACE</button><label id="mode-description" class="native-label">One car: host drives, friend navigates. Host can change mode in the lobby.</label><label id="course-status" class="native-label">The host can choose a course when all 2 matching players are connected.</label>
<div id="courses"></div><button id="advanced-toggle">LAN / ADVANCED</button><label id="version-note" class="native-label">Everyone needs the same game version.</label>
</main>
<div id="hud" class="hidden"><div id="race-status" class="native-box"></div><button id="back-lobby">RETURN TO LOBBY</button></div>
<div id="map-panel" class="native-box hidden"><canvas id="tablet-map" width="600" height="600" aria-label="Navigator tablet route"></canvas><button id="map-close">CLOSE TABLET</button></div>
<div id="browser-menu" class="native-box hidden"><div>RIGHT RIGHT RIGHT</div><p>WASD drive | Space handbrake | Mouse look<br>E grab/drop tablet | G close door | hold C wipe<br>Tab read tablet | F8 host retry | Esc cursor</p><button id="resume-game">BACK TO GAME</button><button id="retry-game">RETRY COURSE</button><button id="menu-lobby">RETURN TO LOBBY</button><button id="exit-game">DISCONNECT</button><label><input id="audio-setting" type="checkbox" checked> Audio</label><select id="quality-setting" aria-label="Graphics"><option value="auto">Automatic graphics</option><option value="high">High graphics</option><option value="low">Low graphics</option></select></div>
<div id="touch-controls" class="hidden"><button data-key="KeyA">◀</button><button data-key="KeyD">▶</button><button data-key="KeyC">C</button><button data-key="KeyG">G</button><button data-key="KeyE">E</button><button data-key="KeyS">S</button><button data-key="KeyW">W</button><button id="touch-menu">MENU</button></div>
<div id="toast" class="native-box hidden" role="status" aria-live="polite"></div><script type="module" src="/client/main.js"></script></body></html>
