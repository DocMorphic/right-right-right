<!doctype html><html><meta charset="utf-8"><title>Spectator motion comparison</title><style>body{margin:0;background:#20271f;font:12px monospace;color:white}canvas{display:block}#tools{position:fixed;left:8px;top:8px;z-index:10;background:#102018d9;padding:10px;max-width:390px}button{padding:8px;margin:3px}#metrics{white-space:pre-wrap}input{width:250px}</style><canvas id="game"></canvas><div id="tools"><button id="next">NEXT BEND</button><button id="map">NEXT MAP</button><button id="pause">PAUSE MOTIONS</button><button id="wide">WIDE VIEW</button><button id="hide">HIDE TOOLS (H)</button><p>Reference pose time <input id="time" type="range" min="0" max="3" step="0.025" value="0"></p><pre id="metrics">Loading original forest and character skins…</pre></div><script type="module">
import * as T from'three';import{RallyView}from'./client/view.js';import{generateCourse,STAGES}from'./shared/course.js';import{generateSpectators}from'./shared/spectators.js';import{CHEER_STYLES}from'./shared/spectator-cheering.js';
const view=new RallyView(document.querySelector('canvas'));await view.load();view.setQuality('low');let profile=6,index=0,course,group,groups,elapsed=0,paused=false,wide=false,last=performance.now(),frames=[],epoch=0;
function setup(){course=generateCourse(12345,'coop',STAGES[profile].blocks,STAGES[profile].seed);view.buildCourse(course);view.setActive(true);const m=new Map();for(const p of generateSpectators(course)){if(!m.has(p.group))m.set(p.group,[]);m.get(p.group).push(p);}groups=[...m.values()].filter(g=>g.length>=5&&g[0].pocket==='bend');index%=groups.length;group=groups[index];epoch++;camera();}
function camera(){const center=group.reduce((s,p)=>s.add(new T.Vector3(p.x,0,p.z)),new T.Vector3()).multiplyScalar(1/group.length),floor=view.spectators.ground(center.x,center.z,group[0].y),distance=group[0].group-(wide?16:9);let i=0;while(i<course.distances.length-2&&course.distances[i+1]<distance)i++;const a=course.points[i],b=course.points[i+1],t=(distance-course.distances[i])/(course.distances[i+1]-course.distances[i]);view.camera.position.set(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t+(wide?6:1.65),a.z+(b.z-a.z)*t);view.camera.lookAt(center.x,floor+1.0,center.z);view.camera.fov=65;view.camera.updateProjectionMatrix();view.externalCamera=true;view.frame.reset();}
setup();document.querySelector('#next').onclick=()=>{index=(index+1)%groups.length;group=groups[index];camera();};document.querySelector('#map').onclick=()=>{profile=profile===8?6:profile+1;index=0;setup();};document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'PLAY MOTIONS':'PAUSE MOTIONS';};document.querySelector('#wide').onclick=()=>{wide=!wide;camera();};document.querySelector('#time').oninput=e=>{paused=true;elapsed=+e.target.value;document.querySelector('#pause').textContent='PLAY MOTIONS';for(const p of view.spectators.pool)p.lastTick=-Infinity;};document.querySelector('#hide').onclick=()=>document.querySelector('#tools').hidden=true;document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h')document.querySelector('#tools').hidden=!document.querySelector('#tools').hidden;});
function draw(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)elapsed+=dt;frames.push(dt*1000);if(frames.length>300)frames.shift();view.renderer.info.autoReset=false;view.renderer.info.reset();view.spectators.update({epoch,elapsed,phase:paused?'paused':'running',spectatorHits:[],spectatorBodies:[]},view.camera.position,now,'low');view.details?.update(view.camera.position.x,view.camera.position.z,now);view.shadows.update();view.frame.render(view.scene,view.camera,now);if(now%300<25)document.querySelector('#metrics').textContent=JSON.stringify({map:STAGES[profile].name,group:group[0].group,bendRadians:group[0].bend,groupMembers:group.length,elapsed,paused,motions:group.map(p=>({id:p.id,style:CHEER_STYLES[p.motion],tempo:p.tempo,phase:p.phase})),...view.spectators.stats,frameP95Ms:[...frames].sort((a,b)=>a-b)[Math.floor(frames.length*.95)],drawCalls:view.renderer.info.render.calls,originalForestVisible:true},null,2);requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
