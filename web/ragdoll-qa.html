<!doctype html><html><meta charset="utf-8"><style>body{margin:0;background:#222;color:#eee;font:12px monospace}#tools{position:fixed;top:8px;left:8px;z-index:10;background:#222c;padding:6px}button{padding:6px}pre{margin:4px}</style><canvas id="game"></canvas><div id="tools"><button id="run">HIT AND DRIVE</button><button id="side">SIDE CAMERA</button><button id="driver">DRIVER CAMERA</button><button id="navigator">NAVIGATOR CAMERA</button><button id="pause">PAUSE</button><button id="early">HOOD 0.30s</button><button id="glass">GLASS 0.60s</button><button id="roof">ROOF 0.90s</button><button id="reset">RESET</button><button id="hide">HIDE</button><pre id="metrics">Loading original assets…</pre></div><script type="module">
import * as T from 'three';import{RallyView}from'./client/view.js';import{generateCourse}from'./shared/course.js';import{makeWorld,stepWorld}from'./shared/physics.js';import{stepSpectators}from'./shared/spectators.js';import{stepSpectatorBodies,decodeRagdoll}from'./shared/spectator-ragdoll.js';
const view=new RallyView(document.querySelector('#game'));await view.load();view.setQuality('auto');const course={...generateCourse(12345,'coop',4,404),spectators:[{id:0,x:0,y:20,z:50,yaw:Math.PI,scale:1,variant:0,phase:0,side:1,group:50},{id:1,x:3.2,y:20,z:52,yaw:-Math.PI/2,scale:1,variant:1,phase:1,side:1,group:51}]};view.buildCourse(course);view.setActive(true);let world,elapsed=0,playing=false,mode='side',impact=false,previous=performance.now(),lastSnapshot=0,frames=0,seconds=0,fps=0;
function reset(){world=makeWorld(course,'coop',Date.now());world.phase='running';const c=world.cars[0];Object.assign(c,{x:0,y:20.68,z:47.9,yaw:0,lastX:0,lastZ:47.9,vx:0,vz:14,speed:14,nearest:38,progress:38});elapsed=0;playing=false;impact=false;view.setSnapshot(structuredClone(world));lastSnapshot=0;view.frame.reset();}
function step(){const c=world.cars[0];c.lastX=c.x;c.lastZ=c.z;c.z+=14*.01;world.elapsed+=.01;elapsed+=.01;stepSpectators(world,.01,course);stepSpectatorBodies(world,.01,course);if(elapsed-lastSnapshot>=.05){view.setSnapshot(structuredClone(world));lastSnapshot=elapsed;}}
function sample(t){reset();for(let i=0;i<Math.round(t*100);i++)step();view.setSnapshot(structuredClone(world));}
reset();document.querySelector('#run').onclick=()=>{reset();playing=true;};document.querySelector('#side').onclick=()=>mode='side';document.querySelector('#driver').onclick=()=>{mode='driver';view.setSeat(0);view.look={pitch:0,yaw:0};};document.querySelector('#navigator').onclick=()=>{mode='driver';view.setSeat(1);view.look={pitch:0,yaw:0};};document.querySelector('#pause').onclick=()=>playing=!playing;document.querySelector('#early').onclick=()=>sample(.3);document.querySelector('#glass').onclick=()=>sample(.6);document.querySelector('#roof').onclick=()=>sample(.9);document.querySelector('#reset').onclick=reset;document.querySelector('#hide').onclick=()=>document.querySelector('#tools').hidden=true;
function draw(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;if(playing){const n=Math.min(5,Math.max(1,Math.round(dt*100)));for(let i=0;i<n;i++)step();if(elapsed>7)playing=false;}frames++;seconds+=dt;if(seconds>1){fps=frames/seconds;frames=0;seconds=0;}view.renderer.info.autoReset=false;view.renderer.info.reset();if(view.externalCamera!==(mode==='side'))view.setExternalCamera(mode==='side');for(const c of view.cars)c.presentation=null;if(mode==='driver'){view.update(dt,now,{throttle:.3});}else{const c=world.cars[0];view.applyCar(view.cars[0],c,c,now,{},dt);view.camera.position.set(5,22.1,c.z+2);view.camera.lookAt(0,21.1,c.z+.6);view.camera.fov=62;view.camera.updateProjectionMatrix();view.spectators.update(view.snapshot,view.camera.position,now,'auto',view.cars);view.shadows.update();view.frame.render(view.scene,view.camera,now);}document.querySelector('#metrics').textContent=JSON.stringify({fps:Math.round(fps),seconds:+elapsed.toFixed(2),hits:world.spectatorHits.length,bodies:world.spectatorBodies.length,active:world.spectatorBodies.filter(b=>b.a).length,contactMasks:world.spectatorBodies.map(b=>b.c),poseBytes:JSON.stringify(world.spectatorBodies).length,headHeight:world.spectatorBodies[0]?+(decodeRagdoll(world.spectatorBodies[0].p,world.spectatorBodies[0].o)[10]-20).toFixed(3):null,...view.spectators.stats},null,2);requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
