<!doctype html><html><meta charset="utf-8"><title>Live multiplayer verification</title><style>body{margin:0;background:#18251e;color:white;font:12px monospace}canvas{display:block}#tools{position:fixed;z-index:5;top:8px;left:8px;background:#101a14cc;padding:8px;max-width:470px}button{padding:7px;margin:3px}pre{margin:4px;white-space:pre-wrap;max-height:280px;overflow:auto}</style><canvas id="game"></canvas><div id="tools"><button id="connect" disabled>LOADING ORIGINAL ASSETS…</button><button id="pass">DRIVE PAST / RETRY</button><button id="hit">HIT CROWD / RETRY</button><button id="drop">DROP / PICK UP TABLET</button><button id="door">OPEN / CLOSE DOOR</button><button id="lookdown">LOOK AT FOOTWELL</button><button id="park">PARK / BRAKE</button><button id="route">CONTINUE ROUTE</button><pre id="metrics"></pre></div><script type="module">
import{NetworkTiming}from'./client/network-timing.js';import{RallyView}from'./client/view.js';import{RallyAudio}from'./client/audio.js';import{generateCourse,STAGES,nearestPoint}from'./shared/course.js';import{generateSpectators}from'./shared/spectators.js';import{routeInput}from'./server/route-driver.js';
const params=new URL(location.href).searchParams,server=params.get('server')||'ws://127.0.0.1:8787/ws',code=params.get('code'),view=new RallyView(document.querySelector('#game')),audio=new RallyAudio(),status=document.querySelector('#metrics'),frames=[],snapGaps=[],audioCosts=[],events=[],actionQueue=[];
const timing=new NetworkTiming();const messages=[];let ws,slot=code?1:0,room='',state,course,path,epoch=0,seq=0,actionId=0,scenario=params.get('scenario')||'pass',started=false,lastInput=0,previous=performance.now(),lastSnapshot=0,lastPose,frameJump=0,cheerPeak=0,impactPeak=0,firstHit=null,phaseHits=0;
const originVoice=audio.spectators.voice.bind(audio.spectators);let analyser,meter;
audio.spectators.voice=(name,loop,offset)=>{const v=originVoice(name,loop,offset);if(v){events.push({name,loop,offset,elapsed:state?.elapsed,at:audio.context.currentTime});(v.pan||v.gain).connect(analyser);}return v;};
await view.load();view.setQuality('low');await audio.init(view.manifest);analyser=audio.context.createAnalyser();analyser.fftSize=1024;meter=new Float32Array(1024);document.querySelector('#connect').disabled=false;document.querySelector('#connect').textContent=code?'JOIN NAVIGATOR + ENABLE SOUND':'HOST DRIVER + ENABLE SOUND';
const send=m=>ws?.readyState===1&&ws.send(JSON.stringify(m));
function setPath(){const person=generateSpectators(course)[0],near=nearestPoint(course,person.x,person.z),at=course.distances[near.index],nx=Math.sin(person.yaw),nz=Math.cos(person.yaw);path={...course,points:course.points.map((p,i)=>{const t=Math.max(0,Math.min(1,(course.distances[i]-(at-25))/25)),gain=t*t*(3-2*t);return{...p,x:p.x-nx*near.distance*gain,z:p.z-nz*near.distance*gain};})};}
document.querySelector('#connect').onclick=()=>{audio.unlock();ws=new WebSocket(server);ws.onmessage=event=>{const m=JSON.parse(event.data);if(m.type==='pong')timing.acceptPong(m);if(!['snapshot','pong'].includes(m.type))messages.push(m.type==='race'?{type:m.type,epoch:m.epoch}:m);if(messages.length>12)messages.shift();
 if(m.type==='welcome')send(code?{type:'join',code,name:'Audio QA navigator'}:{type:'create',mode:'coop',profile:7,seed:12345,name:'Audio QA driver'});
 if(m.type==='joined'){room=m.code;slot=m.slot;send({type:'ready',ready:true,catalog:9});}
 if(m.type==='lobby'&&m.seats[slot]&&!m.seats[slot].ready)send({type:'ready',ready:true,catalog:9});
 if(m.type==='lobby'&&slot===0&&!started&&m.seats.length===2&&m.seats.every(s=>s?.ready)){started=true;send({type:'start',stageReady:true});}
 if(m.type==='race'){epoch=m.epoch;seq=0;actionId=0;firstHit=null;phaseHits=0;lastPose=null;frameJump=0;cheerPeak=impactPeak=0;events.length=frames.length=snapGaps.length=audioCosts.length=0;const stage=STAGES[m.profile];course=generateCourse(m.seed,m.mode,stage.blocks,stage.seed);view.buildCourse(course);view.setSeat(slot);view.setActive(true);view.look={pitch:slot%2?30:0,yaw:0};audio.setCourse(course);audio.active=true;setPath();state=m.snapshot;view.setSnapshot(state);send({type:'stageReady',epoch,ready:true});}
 if(m.type==='snapshot'){const now=performance.now();if(lastSnapshot)snapGaps.push(now-lastSnapshot);lastSnapshot=now;state=m;view.setSnapshot(state);if(m.spectatorHits?.length&&!firstHit)firstHit=m.elapsed;phaseHits=Math.max(phaseHits,m.spectatorHits?.length||0);}
 if(m.type==='error')status.textContent=JSON.stringify(m);
 };};
for(const kind of['pass','hit'])document.querySelector('#'+kind).onclick=()=>{scenario=kind;send({type:'retry'});};document.querySelector('#drop').onclick=()=>actionQueue.push({id:++actionId,kind:'grab'});document.querySelector('#door').onclick=()=>actionQueue.push({id:++actionId,kind:'door'});
document.querySelector('#lookdown').onclick=()=>view.look.pitch=65;document.querySelector('#park').onclick=()=>scenario='park';document.querySelector('#route').onclick=()=>scenario='route';setInterval(()=>send(timing.ping()),500);
const p95=a=>a.length?[...a].sort((a,b)=>a-b)[Math.floor(a.length*.95)]:0;
function frame(now){const dt=Math.min(.1,(now-previous)/1000);previous=now;let input={throttle:0,steer:0,handbrake:false,pitch:slot%2?30:0,yaw:0};
 if(course&&state?.phase==='running'&&slot===0){input={...input,...routeInput(scenario==='hit'?path:course,state,0,{maxSpeed:scenario==='hit'?12:10,responseSeconds:server.includes('8790')?.35:.08})};const person=generateSpectators(course)[0],near=nearestPoint(course,person.x,person.z);if(scenario==='park'||scenario==='pass'&&state.cars[0].progress>near.index+28||firstHit!==null&&state.elapsed-firstHit>1.0)input={...input,throttle:state.cars[0].speed>.25?-1:0,steer:0};}
 if(epoch&&now-lastInput>=40){const next=++seq;view.presentation?.recordInput(next);send({type:'input',epoch,seq:next,...input,actions:actionQueue.splice(0)});lastInput=now;}
 view.update(dt,now,input);const start=performance.now();audio.update(state,slot,input,view.presentation?.predicted);audioCosts.push(performance.now()-start);
 if(state?.phase==='running'){frames.push(dt*1000);const pose=view.presentation?.rendered;if(pose&&lastPose)frameJump=Math.max(frameJump,Math.hypot(pose.x-lastPose.x,pose.z-lastPose.z));if(pose)lastPose={...pose};analyser.getFloatTimeDomainData(meter);let peak=0;for(const value of meter)peak=Math.max(peak,Math.abs(value));if(audio.spectators.voices.size)cheerPeak=Math.max(cheerPeak,peak);if(audio.spectators.shots.size)impactPeak=Math.max(impactPeak,peak);}
 if(now%200<25){const c=state?.cars?.[0];status.textContent=JSON.stringify({messages,server,room,slot,phase:state?.phase,scenario,epoch,seq:state?.seq,car:c?{x:c.x,y:c.y,z:c.z,speed:c.speed,dead:c.dead,grounded:c.grounded,door:c.door,doorAngle:c.doorAngle}:null,hits:phaseHits,cheerStarts:events.filter(e=>e.loop).map(e=>e.name),impactStarts:events.filter(e=>!e.loop).map(e=>e.name),cheerPeak,impactPeak,context:audio.context.state,missingSounds:audio.loadErrors,frameP95Ms:p95(frames),snapshotP95Ms:p95(snapGaps),audioUpdateP95Ms:p95(audioCosts),maxFrameJumpMeters:frameJump,fixture:state?.fixture,tablet:state?.tablets?.[0],tabletRender:view.tablets[0]?{position:view.tablets[0].model.position.toArray(),quaternion:view.tablets[0].model.quaternion.toArray()}:null},null,2);}
 requestAnimationFrame(frame);
}requestAnimationFrame(frame);
</script></html>
