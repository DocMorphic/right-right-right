<!doctype html><html><meta charset="utf-8"><style>body{margin:0;background:#222;color:#eee;font:12px monospace}#tools{position:fixed;top:8px;left:8px;z-index:10;background:#222b;padding:6px}button{padding:7px}pre{margin:4px}</style><canvas id="game"></canvas><div id="tools"><button id="one">ORIGINAL 01</button><button id="two">ORIGINAL 02</button><button id="three">ORIGINAL 03</button><button id="start">START LINE</button><button id="crowd">CROWD AREA</button><button id="driver">DRIVER</button><button id="outside">OUTSIDE</button><button id="hide">HIDE TOOLS</button><pre id="metrics">Loading original forest…</pre></div><script type="module">
import * as T from 'three';import{RallyView}from'./client/view.js';import{generateCourse,direction,nearestPoint}from'./shared/course.js';import{makeWorld}from'./shared/physics.js';import{generateSpectators}from'./shared/spectators.js';
const view=new RallyView(document.querySelector('#game'));await view.load();view.setQuality('high');view.setActive(true);let rayGaps=[],stage=1001,course,world,external=true,location='crowd',time=performance.now();const position=new T.Vector3(),target=new T.Vector3();
function place(){const c=world.cars[0],person=generateSpectators(course)[0],index=location==='start'?course.startIndex:nearestPoint(course,person.x,person.z).index,p=course.points[index],d=direction(course.points,index);Object.assign(c,{x:p.x,z:p.z,y:p.y+.68,yaw:Math.atan2(d.x,d.z),nearest:index,progress:index});view.resetPresentation();view.frame.reset();}
function setup(){course=generateCourse(12345,'coop',0,stage);view.buildCourse(course);world=makeWorld(course,'coop',stage);world.phase='running';view.setSnapshot(world);view.setExternalCamera(external);place();}
setup();const render=view.frame.render.bind(view.frame);view.frame.render=(scene,camera,now)=>{if(external){view.cars[0].model.updateWorldMatrix(true,false);position.set(2.05,.95,4.7);view.cars[0].model.localToWorld(position);target.set(0,.58,0);view.cars[0].model.localToWorld(target);camera.position.copy(position);camera.lookAt(target);camera.fov=66;camera.updateProjectionMatrix();}render(scene,camera,now);};
for(const[id,value]of[['one',1001],['two',1002],['three',1003]])document.querySelector('#'+id).onclick=()=>{stage=value;setup();};document.querySelector('#start').onclick=()=>{location='start';place();};document.querySelector('#crowd').onclick=()=>{location='crowd';place();};document.querySelector('#driver').onclick=()=>{external=false;view.setExternalCamera(false);view.look={pitch:0,yaw:0};};document.querySelector('#outside').onclick=()=>{external=true;view.setExternalCamera(true);};document.querySelector('#hide').onclick=()=>document.querySelector('#tools').hidden=true;
function draw(now){const dt=Math.min(.04,(now-time)/1000);time=now;world.elapsed+=dt;view.update(dt,now,{});const contact=view.cars[0].wheelContact;if(Math.floor(now/500)!==Math.floor((now-dt*1000)/500)){const road=view.world.children.find(n=>n.isMesh&&!n.isInstancedMesh&&n.geometry.attributes.position.count===course.roadMesh.positions.length/3),ray=new T.Raycaster(),p=new T.Vector3(),down=new T.Vector3(0,-1,0);rayGaps=contact.wheels.map(w=>{w.mesh.updateWorldMatrix(true,false);let min=Infinity,lowest=new T.Vector3();for(const v of w.vertices){p.copy(v).applyMatrix4(w.mesh.matrixWorld);if(p.y<min){min=p.y;lowest.copy(p);}}ray.set(lowest.clone().add(new T.Vector3(0,1,0)),down);const hit=ray.intersectObject(road,false)[0];return hit?+((lowest.y-hit.point.y)*1000).toFixed(2):null;});}document.querySelector('#metrics').textContent=JSON.stringify({originalStage:stage-1000,nativeScene:course.nativeScene,roadsideTrees:course.trees.length,backgroundTrees:view.nativeScenery.scenes.get(course.nativeScene).data.backgroundTrees.length,terrainChunks:view.world.children.filter(n=>n.userData.terrainChunk).length,raycastVisibleRoadGapMm:rayGaps,tyreContactGapMm:contact.wheels.map(w=>+(w.gap*1000).toFixed(2)),suspensionOffsetMm:contact.wheels.map(w=>+(w.offset*1000).toFixed(2)),external},null,2);requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
