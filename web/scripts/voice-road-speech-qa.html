<!doctype html><meta charset="utf-8"><title>Voice Roads speech checks</title>
<style>body{background:#211f17;color:#ebc786;font:18px system-ui;padding:32px}button{font:inherit;padding:12px;background:#ec8b29;color:#171710;border:0;border-radius:6px}pre{white-space:pre-wrap;font-size:15px}progress{width:400px}</style>
<h1>Voice Roads · speech check</h1><button id="run">Run speech checks</button><p id="status">20 prerecorded calls · US and Indian English · no microphone</p><progress id="progress" max="20" value="0"></progress><pre id="results"></pre>
<script type="module">
import {ROAD_PHRASES,parseRoadCall} from '/commands.js';
const $=id=>document.getElementById(id);let maxGap=0,last=performance.now(),running=false;function frame(now){if(running)maxGap=Math.max(maxGap,now-last);last=now;requestAnimationFrame(frame);}requestAnimationFrame(frame);
$('run').onclick=async()=>{ $('run').disabled=true;running=true;try{
 $('status').textContent='Loading local speech model…';const library=await import('/bundled-vosk.js'),Vosk=library.default||library;const started=performance.now(),model=new Vosk.Model(new URL('/model-v2.tar.gz',location.href).href,1),context=new AudioContext({sampleRate:16000});await context.resume();await Promise.race([new Promise((resolve,reject)=>{model.on('load',e=>e.result?resolve():reject(Error('Model load failed')));model.on('error',e=>reject(Error(JSON.stringify(e))));}),new Promise((_,reject)=>setTimeout(()=>reject(Error('Model load timeout')),45000))]);const samples=await fetch('/samples/samples.json').then(r=>r.json());$('progress').max=samples.length;let passed=0;window.speechResults=[];
 for(const sample of samples){$('status').textContent=`Recognizing ${sample.voice}: ${sample.phrase}`;const buffer=await context.decodeAudioData(await fetch(sample.url).then(r=>r.arrayBuffer())),recognizer=new model.KaldiRecognizer(context.sampleRate,JSON.stringify(ROAD_PHRASES));let finals=[],partial='',done,audioDone,responses=0,expected=0,finishing=false;const drained=new Promise(resolve=>audioDone=resolve);const response=()=>{responses++;if(responses===expected)audioDone();};
 const completed=new Promise(resolve=>done=resolve);recognizer.on('result',e=>{if(e.result.text)finals.push(e.result.text);if(finishing)done();else response();});recognizer.on('partialresult',e=>{partial=e.result.partial||'';response();});
 const pcm=buffer.getChannelData(0),size=1920;expected=Math.ceil(pcm.length/size);for(let i=0;i<pcm.length;i+=size)recognizer.acceptWaveformFloat(pcm.slice(i,i+size),context.sampleRate);await drained;finishing=true;recognizer.retrieveFinalResult();await Promise.race([completed,new Promise((_,reject)=>setTimeout(()=>reject(Error('Recognizer timeout')),30000))]);
 const text=finals.join(' ').trim()||partial,actual=parseRoadCall(text),ok=actual===sample.expected;passed+=Number(ok);window.speechResults.push({...sample,text,actual,ok});$('results').textContent+=`${ok?'PASS':'FAIL'} ${sample.voice} “${sample.phrase}” → “${text}” → ${actual}\n`;$('progress').value++;recognizer.remove();
 }
 model.terminate();await context.close();window.speechSummary={passed,total:samples.length,maxFrameGapMs:Math.round(maxGap),elapsedSeconds:Math.round((performance.now()-started)/1000)};$('status').textContent=JSON.stringify(window.speechSummary);running=false;
 }catch(error){running=false;$('status').textContent='ERROR: '+error.message;console.error(error);}};
</script>
