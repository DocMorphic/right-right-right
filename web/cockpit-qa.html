<!doctype html><html><meta charset="utf-8"><style>body{margin:0;background:#222}#tools{position:fixed;z-index:20;top:8px;left:8px}button{font:14px monospace;padding:8px}</style><canvas id="game"></canvas><div id="tools"><button id="driver">DRIVER</button><button id="dash">DASHBOARD</button><button id="gauges">INSTRUMENT CLOSE-UP</button><button id="tablet">TABLET</button><button id="reference">REFERENCE TABLET</button><button id="drop">DROP TABLET</button><button id="left">LEFT</button><button id="center">CENTER</button><button id="right">RIGHT</button><button id="fullleft">FULL LEFT</button><button id="fullright">FULL RIGHT</button><button id="brake">HANDBRAKE</button><button id="idle">IDLE</button><button id="drive">80 KM/H</button><button id="mud">MUD FULL</button><button id="wipe">WIPE HOLD</button><button id="clean">CLEAN GLASS</button><button id="door">TOGGLE DOOR</button><button id="travel">TRAVEL</button><button id="pan">PAN CAMERA</button><button id="blur">TOGGLE BLUR</button><button id="shadows">TOGGLE SHADOWS</button><button id="pause">PAUSE SAMPLE</button><button id="diagnose">SHADOW DIAGNOSTICS</button><pre id="diagnostics" style="background:#222;color:white;font:10px monospace"></pre><button id="hide">HIDE TOOLS</button><output id="metrics" style="display:block;color:white;background:#222;padding:8px;font:12px monospace">Loading…</output></div><script type="module">
import {RallyView,initialLookPitch} from '/client/view.js';import {generateCourse} from '/shared/course.js';import {makeWorld,CAR} from '/shared/physics.js';
const view=new RallyView(document.querySelector('#game'));await view.load();view.setQuality('high');const course=generateCourse(12345,'coop',0,1001);view.buildCourse(course);view.setActive(true);const snapshot=makeWorld(course,'coop',1);snapshot.phase='running';snapshot.inputs=[{},{}];view.setSnapshot(snapshot);let speed=0,steer=0,throttle=0,handbrake=false,wiping=false,travel=false,panning=false,paused=false,distance=0;
function restoreView(){view.camera.zoom=1;for(const c of view.cars){c.wheel.visible=true;c.driver.visible=true;}view.camera.updateProjectionMatrix();}
document.querySelector('#gauges').onclick=()=>{restoreView();view.setSeat(0);view.look.pitch=18;view.camera.zoom=3.5;view.camera.updateProjectionMatrix();for(const c of view.cars){c.wheel.visible=false;c.driver.visible=false;}};
document.querySelector('#driver').onclick=()=>{restoreView();view.setSeat(0);view.look.pitch=0;};document.querySelector('#dash').onclick=()=>{restoreView();view.setSeat(0);view.look.pitch=24;};document.querySelector('#tablet').onclick=()=>{restoreView();view.setSeat(1);view.look.pitch=initialLookPitch(1);};document.querySelector('#reference').onclick=()=>{restoreView();view.setSeat(1);view.look.pitch=24.6;};document.querySelector('#drop').onclick=()=>{snapshot.tablets[0].holder=snapshot.tablets[0].holder<0?1:-1;};document.querySelector('#left').onclick=()=>steer=-.55;document.querySelector('#center').onclick=()=>steer=0;document.querySelector('#right').onclick=()=>steer=.55;document.querySelector('#fullleft').onclick=()=>steer=-1;document.querySelector('#fullright').onclick=()=>steer=1;document.querySelector('#brake').onclick=()=>handbrake=!handbrake;document.querySelector('#idle').onclick=()=>{speed=0;throttle=0;};document.querySelector('#drive').onclick=()=>{speed=80/3.6;throttle=.6;};document.querySelector('#hide').onclick=()=>document.querySelector('#tools').hidden=true;document.querySelector('#mud').onclick=()=>{snapshot.cars[0].mud=1;wiping=false;};document.querySelector('#wipe').onclick=()=>wiping=!wiping;document.querySelector('#clean').onclick=()=>{snapshot.cars[0].mud=0;wiping=false;};document.querySelector('#door').onclick=()=>snapshot.cars[0].doorAngle=snapshot.cars[0].doorAngle?0:85;document.querySelector('#travel').onclick=()=>{travel=!travel;if(travel)speed=80/3.6;};document.querySelector('#pan').onclick=()=>panning=!panning;document.querySelector('#blur').onclick=()=>{view.frame.motionSettings.active=!view.frame.motionSettings.active;if(paused)presentSample();};document.querySelector('#pause').onclick=()=>paused=!paused;document.querySelector('#diagnose').onclick=()=>{const csm=view.shadows.csm,gl=view.renderer.getContext();let casters=0,receivers=0;view.world.traverse(n=>{if(n.isMesh){if(n.castShadow)casters++;if(n.receiveShadow)receivers++;}});document.querySelector('#diagnostics').textContent=JSON.stringify({enabled:view.renderer.shadowMap.enabled,autoUpdate:view.renderer.shadowMap.autoUpdate,casters,receivers,materials:csm.shaders.size,lights:csm.lights.map(l=>({position:l.position.toArray(),target:l.target.position.toArray(),map:l.shadow.map?.width,strength:l.shadow.intensity,mask:l.shadow.camera.layers.mask,bias:l.shadow.bias,normalBias:l.shadow.normalBias,matrix:l.shadow.matrix.elements})),programs:view.renderer.info.programs.map(p=>({defines:(gl.getShaderSource(p.fragmentShader).match(/#define (?:USE_CSM|CSM_CASCADES|USE_SHADOWMAP|NUM_DIR_LIGHTS|NUM_DIR_LIGHT_SHADOWS)[^\n]*/g)||[])}))},null,2);};document.querySelector('#shadows').onclick=()=>{for(const l of view.shadows.csm.lights)l.shadow.intensity=l.shadow.intensity?0:view.cabinSurfaces.shadows.strength;if(paused){view.frame.reset();view.update(0,previous,{throttle,steer,handbrake,wipe:wiping});}};let frames=0,frameSeconds=0,fps=0;let previous=performance.now();function presentSample(){const f=view.frame,r=view.renderer,bg=view.scene.background,mask=view.camera.layers.mask,auto=r.autoClear,shadows=r.shadowMap.autoUpdate;f.material.uniforms.motionIntensity.value=f.motionSettings.active?f.motionSettings.intensity:0;r.autoClear=true;r.render(f.scene,f.camera);r.autoClear=false;r.clearDepth();view.scene.background=null;view.camera.layers.set(1);r.shadowMap.autoUpdate=false;r.render(view.scene,view.camera);view.scene.background=bg;view.camera.layers.mask=mask;r.autoClear=auto;r.shadowMap.autoUpdate=shadows;}function draw(now){if(paused){requestAnimationFrame(draw);return;}const elapsed=(now-previous)/1000;frames++;frameSeconds+=elapsed;if(frameSeconds>=1){fps=frames/frameSeconds;frames=0;frameSeconds=0;}const dt=Math.min(.04,elapsed);previous=now;snapshot.elapsed+=dt;const car=snapshot.cars[0];if(travel){distance+=speed*dt;if(distance>course.distances.at(-1)*.8){distance=0;view.frame.reset();}let i=0;while(i<course.points.length-2&&course.distances[i+1]<distance)i++;const a=course.points[i],b=course.points[i+1],fraction=(distance-course.distances[i])/(course.distances[i+1]-course.distances[i]);car.x=a.x+(b.x-a.x)*fraction;car.z=a.z+(b.z-a.z)*fraction;car.y=a.y+(b.y-a.y)*fraction+CAR.height;car.yaw=Math.atan2(b.x-a.x,b.z-a.z);car.nearest=i;car.progress=i;}if(panning)view.look.yaw=Math.sin(now*.0015)*40;car.speed=speed;car.vx=0;car.vz=speed;car.steer=steer;if(wiping)car.mud=Math.max(0,(car.mud||0)-dt/2);snapshot.inputs[0]={throttle,steer,handbrake,wipe:wiping};for(const visual of view.cars)visual.presentation=null;view.update(dt,now,{throttle,steer,handbrake,wipe:wiping});if(Math.floor(now/200)!==Math.floor((now-dt*1000)/200)){const c=view.cars[0];document.querySelector('#metrics').textContent=`FPS ${fps.toFixed(0)} · Blur ${view.frame.motionSettings.active} · Intensity ${view.frame.material.uniforms.motionIntensity.value.toFixed(2)} · Travel ${travel} · Mud ${(car.mud||0).toFixed(2)} · Wiping ${wiping} · Speed ${c.cluster.displayKmh.toFixed(1)} km/h · Wheel ${(steer*110).toFixed(1)}° · Driver palms ${c.hands.arms.map(a=>(a.error*1000).toFixed(2)).join('/')} mm · Tablet palms ${c.tabletHands.arms.map(a=>((a.error||0)*1000).toFixed(2)).join('/')} mm`;}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
