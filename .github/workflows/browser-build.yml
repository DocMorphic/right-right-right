name: Browser game checks

on:
  workflow_dispatch:
  push:
    branches: [main, standalone/portable-steam]
    paths:
      - 'web/**'
      - '.github/workflows/browser-build.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/browser-build.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Multiplayer and gameplay tests
        run: npm test
      - name: Production browser build
        run: npm run build:client
