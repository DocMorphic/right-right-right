<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Original native asset verification</title>

<header><button id="save-proof" style="float:right;background:#354a39;color:#e3eadf;border:1px solid #768974;border-radius:5px;padding:8px 12px">Save visual proof</button><h1>Original native assets · browser verification</h1><p>Stellux Interactive assets exported from the authorized runtime. Left: car and matching forest models. Right: native driver's eye anchor.</p></header>
<main><section id="external"><label>Original car, occupants and six forest species</label></section><section id="cockpit"><label>Original cockpit · driver's seat</label></section></main><div id="status">Loading native meshes…</div>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const base='/web/public';
const manifest=await fetch(base+'/assets/manifest.json').then(r=>r.json());
const loader=new GLTFLoader();
const load=async url=>(await loader.loadAsync(base+url)).scene;
const color=values=>new THREE.Color().setRGB(...values,THREE.SRGBColorSpace);
const setup=id=>{const host=document.getElementById(id),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(64,1,.01,600),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.outputColorSpace=THREE.SRGBColorSpace;scene.background=color(manifest.atmosphere.fog.color);scene.fog=new THREE.Fog(scene.background,85,260);scene.add(new THREE.HemisphereLight(color(manifest.atmosphere.ambient.sky),color(manifest.atmosphere.ambient.ground),1.6));const sun=new THREE.DirectionalLight(color(manifest.atmosphere.sun.color),1.75);sun.position.set(8,15,5);scene.add(sun);host.append(renderer.domElement);const resize=()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)};new ResizeObserver(resize).observe(host);return{host,scene,camera,renderer}};
const a=setup('external'),b=setup('cockpit');
const car=await load(manifest.models.car.url);a.scene.add(car);const inside=car.clone(true);b.scene.add(inside);
inside.traverse(o=>{if(o.isMesh&&o.name.startsWith('Casual2_Head')&&o.parent?.name==='character_fat')o.visible=false});
const floorTexture=await new THREE.TextureLoader().loadAsync(base+manifest.surfaces.ground.albedo);floorTexture.colorSpace=THREE.SRGBColorSpace;floorTexture.wrapS=floorTexture.wrapT=THREE.RepeatWrapping;floorTexture.repeat.set(20,20);const floor=new THREE.Mesh(new THREE.PlaneGeometry(90,90),new THREE.MeshStandardMaterial({map:floorTexture,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.018;a.scene.add(floor);b.scene.add(floor.clone());
for(let i=0;i<manifest.models.trees.length;i++){const tree=await load(manifest.models.trees[i].url);const group=new THREE.Group();group.add(tree);group.position.set((i-2.5)*3,0,-6);a.scene.add(group);b.scene.add(group.clone(true));for(const side of [-1,1]){const line=group.clone(true);line.position.set(side*(5+i*.25),0,6+i*5);b.scene.add(line.clone(true))}}
const roadTexture=await new THREE.TextureLoader().loadAsync(base+manifest.surfaces.road.albedo);roadTexture.colorSpace=THREE.SRGBColorSpace;roadTexture.wrapS=roadTexture.wrapT=THREE.RepeatWrapping;roadTexture.repeat.set(1,10);const road=new THREE.Mesh(new THREE.PlaneGeometry(8.8,90),new THREE.MeshStandardMaterial({map:roadTexture,roughness:1}));road.rotation.x=-Math.PI/2;road.position.y=-.01;a.scene.add(road);b.scene.add(road.clone());
const tablet=await load(manifest.models.tablet.url);tablet.position.fromArray(manifest.anchors.HoldAnchor_Passenger.position);tablet.quaternion.setFromRotationMatrix(new THREE.Matrix4().fromArray(manifest.anchors.HoldAnchor_Passenger.matrix));a.scene.add(tablet);b.scene.add(tablet.clone(true));
a.camera.position.set(4,2.9,5);const controls=new OrbitControls(a.camera,a.renderer.domElement);controls.target.set(0,.75,0);controls.update();
b.camera.position.fromArray(manifest.anchors['Main Camera'].position);b.camera.lookAt(b.camera.position.x,b.camera.position.y-.035,8);

window.assetPreview={loaded:true,manifest};
document.getElementById('save-proof').onclick=()=>{a.renderer.render(a.scene,a.camera);b.renderer.render(b.scene,b.camera);const proof=document.createElement('canvas');proof.width=1920;proof.height=1080;const ctx=proof.getContext('2d');ctx.fillStyle='#17241c';ctx.fillRect(0,0,1920,1080);ctx.fillStyle='#e3eadf';ctx.font='24px system-ui';ctx.fillText('Right Right Right — original native asset export',28,38);ctx.font='16px system-ui';ctx.fillText('Original game/assets: Stellux Interactive · Authorized browser adaptation · Car, seated occupants, cockpit, forest and road',28,67);ctx.drawImage(a.renderer.domElement,0,90,960,960);ctx.drawImage(b.renderer.domElement,960,90,960,960);ctx.fillText('Source meshes, hierarchy, normals, UVs, materials and textures preserved. Native seated skin pose baked. 10 GLBs: 0 validator errors/warnings.',28,1070);const link=document.createElement('a');link.download='RightRightRight-native-assets.png';link.href=proof.toDataURL('image/png');link.click()};
function draw(){controls.update();a.renderer.render(a.scene,a.camera);b.renderer.render(b.scene,b.camera);requestAnimationFrame(draw)}draw();
</script></html>
