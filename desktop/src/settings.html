<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'"><title>Game connection</title><style>body{font:14px -apple-system,sans-serif;margin:28px;color:#eee;background:#24211f}h1{font-size:22px;color:#ed851f}p{line-height:1.5;color:#c6bdad}label{display:block;margin-top:22px}input{display:block;box-sizing:border-box;width:100%;padding:10px;margin:8px 0;background:#161513;color:#fff;border:1px solid #665733;border-radius:7px;font:14px monospace}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}button{padding:8px 15px;border-radius:7px;border:1px solid #665733;background:#3b3019;color:#dbb86b}#error{color:#ffb021;min-height:20px}</style></head><body><h1>Game connection</h1><p>Both Macs must connect to the same host before sharing a room code. Use a friend's host link or a shared WebSocket server.</p><label for="address">Host address</label><input id="address" placeholder="http://192.168.1.20:54321" spellcheck="false" autocomplete="off"><p>Leave this blank to host on this Mac. Changing the connection leaves the current game.</p><div id="error" role="alert"></div><div class="actions"><button id="cancel">Cancel</button><button id="save">Use this host</button></div><script src="settings.js"></script></body></html>
